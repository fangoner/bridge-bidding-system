    opening_statement: "你好，需要我帮你做什么？\n1. 简单叫牌练习：\n- 解释叫牌，示例： “1C-p-1D-p-1S-p-1NT”\n\
      - 建议下一步叫牌，示例： “1C-p-1D-p-1S-p-? ，手牌：A32 654 987 KQJT\"\n\n2. 双人叫牌练习：\n- 输入“发牌“，可以自动发牌，让机器人在南北或东西方向自动叫牌。\n\
      - 可以针对具体牌局练习叫牌。输入示例：\nK85 AT863 Q42 63\nJ73 72 8763 T954    \nQT94 5 KJT AQJ72\n\
      A62 KQJ94 A95 K8\n默认顺序为南西北东\n- 输入”读牌” ，可以上传牌局图片，自动读取牌局数据。\n- 如果在用户输入字段选择人类叫牌位置，可以人工在任意位置参与双人叫牌。\n\
      \n3. 四人叫牌叫牌练习：\n- 输入“发牌”，可以自动发牌，让机器人在四家位置自动叫牌。\n- 可以针对具体牌局练习叫牌，输入同双人叫牌。\n- 输入”读牌”\
      \ ，可以上传牌局图片，自动读取牌局数据。\n- 如果在用户输入字段选择人类叫牌位置，可以人工在任意位置参与四人人叫牌。\n\n4. 如果要和AI对战，可以输入具体牌局，默认AI防守，用户坐庄，如需切换，可以在提示中明确指出，示例如下：\n\
      打牌，AI坐庄，用户防守。牌局如下。牌例采用”Deep Finesse\"格式。：\nDeal: 1 K85 AT863 Q42 63\nContract:\
      \ 4H-South J73 72 8763 T954 QT94 5 KJT AQJ72\nOnLead: West A62 KQJ94 A95 K8\n\
      Lead: CT\n\n5. 桥牌工具：\n- 计算分数，选择”算分“。输入定约如”3NTx-4\"，即可计算分数。\n- 识别牌局照片。请上传牌局图片，并输入“读牌”。\n\
      \n"
