            \n各家手牌以及叫牌过程从{{#1743749483681.text#}}中提取。分别输出以下三种格式：\n\n示例1（图形化布局，具体要求如下）\n\
            矩形牌桌：用 +-------+ 明确画出矩形边界，四角对齐。\n数据完整：保留所有手牌和叫牌信息（包括点数和花色符号）。\n对齐优化：\n\
            东西家手牌与矩形边界横向对齐。\n南北家手牌居中，上下对称。\n\n叫牌过程：叫牌过程必须包含完整叫牌序列中的所有叫品，包括开始牌手的 Pass。填充顺序以庄家（首位叫牌者）为起点，严格按照桥牌固定顺序循环：南\
            \ → 西 → 北 → 东 → （重复）。输出采用按轮次分行的表格布局：\n每一行表示一轮叫牌，每一列表示一个固定位置（South / West\
            \ / North / East）。\n每个位置的叫品必须在该位置列正下方填充。比如东家叫品，必须在东（East）列正下方。\n在第一行中，尚未轮到的方位不得用\
            \ Pass 或任何叫品进行填充，比如，东家开叫，第一行南，西，北必须留空，他们的叫品只能从第二行开始填充。只有在轮到该方位叫牌时，才允许填写其叫品（包括\
            \ Pass）。\n开叫人位置填充好以后，后续叫牌必须按行依次填充，一行填满后才能换下一行继续填充。\n当出现合法的三家连续 Pass后，叫牌过程结束，后续位置不再填充。\n\
