    - data:
        code: "import re\ndef main(contract_str: str)-> dict:\n    \"\"\"计算桥牌得分的主函数\"\
          \"\"\n    # 1. 解析定约字符串\n    match = re.match(r'.*?(\\d+)([CDHSNT]+)([x]*)([+-]\\\
          d+)?', contract_str)\n    if not match:\n        return {\n            \"\
          result\": \"无效的定约格式，示例：5Hx+2, 3NT, 2Dxx-1\"\n        }\n    \n    level\
          \ = int(match.group(1))\n    suit = match.group(2)\n    double_status =\
          \ len(match.group(3))  # 0=未加倍,1=加倍,2=再加倍\n    result = match.group(4) or\
          \ '=0'      # 默认为刚好完成\n    \n    # 解析结果\n    overtricks = int(result[1:])\
          \ if result[0] == '+' else 0\n    undertricks = int(result[1:]) if result[0]\
          \ == '-' else 0\n\n    # 2. 计算得分\n    def calculate(vulnerable):\n     \
          \   # 基本分计算\n        base = 40 + 30*(level-1) if suit == 'NT' else level\
          \ * {'C':20,'D':20,'H':30,'S':30}[suit]\n        actual_base = base * (1\
          \ if double_status==0 else 2 if double_status==1 else 4)\n        \n   \
          \     # 超墩/罚分计算\n        if undertricks > 0:\n            if double_status\
          \ == 0:\n                score = undertricks * (100 if vulnerable else 50)\n\
          \            else:\n                if vulnerable:\n                   \
          \ score = 200 + 300*(undertricks-1)  # 有局加倍：第1墩200，后续300\n             \
          \   else:\n                    # 无局加倍：第1墩100，第2-3墩200，第4+墩300\n        \
          \            if undertricks == 1: score = 100\n                    elif\
          \ undertricks <=3: score = 100 + 200*(undertricks-1)\n                 \
          \   else: score = 100 + 400 + 300*(undertricks-3)\n                if double_status\
          \ == 2: score *= 2  # 再加倍\n        else:\n            # 超墩分\n          \
          \  if double_status == 0:\n                trick_value = 30 if suit == 'NT'\
          \ else {'C':20,'D':20,'H':30,'S':30}[suit]\n                score = actual_base\
          \ + overtricks * trick_value\n            else:\n                trick_value\
          \ = 200 if vulnerable else 100\n                if double_status == 2: trick_value\
          \ *= 2\n                score = actual_base + overtricks * trick_value\n\
          \        \n        # 奖分计算\n        if actual_base >= 100:  # 成局\n      \
          \      bonus = 500 if vulnerable else 300\n        else:\n            bonus\
          \ = 50\n        \n        if level == 6: bonus += 750 if vulnerable else\
          \ 500    # 小满贯\n        elif level == 7: bonus += 1500 if vulnerable else\
          \ 1000 # 大满贯\n        \n        if double_status == 1: bonus += 50   # 加倍奖分\n\
          \        elif double_status == 2: bonus += 100 # 再加倍奖分\n        \n     \
          \   return -score if undertricks > 0 else score + bonus\n\n    # 3. 返回有局/无局结果\n\
          \    return {\n        \"result\": '无局得分:'+ str(calculate(False)) + '  \
          \  ' + '有局得分:' + str(calculate(True))\n    }"
