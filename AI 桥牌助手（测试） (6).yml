          \          \n    # 去掉bids中打头的所有“pass”\n    pass_time = 0\n    while bids\
          \ and bids[0].strip() =='pass': \n        bids.pop(0)\n        pass_time\
          \ += 1\n    if len(bids) == 0: return { \"result\": \"花色开叫\" }     \n  \
