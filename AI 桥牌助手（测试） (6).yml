    - data:
        code: "import random\nimport json\nimport re\nfrom collections import defaultdict\n\
          \  \nclass BridgeDealer:\n    def __init__(self):\n        self.suits =\
          \ [\"♠\", \"♥\", \"♦\", \"♣\"]\n        self.rank_order = [\"A\", \"K\"\
          , \"Q\", \"J\", \"T\", \"9\", \"8\", \"7\", \"6\", \"5\", \"4\", \"3\",\
          \ \"2\"]\n        self.deck = []\n        self.hands = {\n            \"\
          East\": defaultdict(list),\n            \"South\": defaultdict(list),\n\
          \            \"West\": defaultdict(list),\n            \"North\": defaultdict(list)\n\
          \        }\n        self._generate_deck()\n        \n    def _generate_deck(self):\n\
          \        \"\"\"生成标准52张牌\"\"\"\n        self.deck = [(suit, rank) for suit\
          \ in self.suits for rank in self.rank_order]\n        \n    def _fisher_yates_shuffle(self,\
          \ rounds=7):\n        \"\"\"执行多轮费雪耶茨洗牌\"\"\"\n        for _ in range(rounds):\n\
          \            for i in range(len(self.deck)-1, 0, -1):\n                j\
          \ = random.randint(0, i)\n                self.deck[i], self.deck[j] = self.deck[j],\
          \ self.deck[i]\n                \n    def _deal_cards(self):\n        \"\
          \"\"发牌核心逻辑（带实时校验）\"\"\"\n        players = [\"East\", \"South\", \"West\"\
          , \"North\"]\n        counters = {p: 0 for p in players}\n        \n   \
          \     for i, (suit, rank) in enumerate(self.deck):\n            target =\
          \ players[i % 4]\n            if counters[target] >= 13:\n             \
          \   raise ValueError(f\"玩家 {target} 已超过13张牌\")\n                \n     \
          \       self.hands[target][suit].append(rank)\n            counters[target]\
          \ += 1\n            \n        # 发牌后立即校验\n        if sum(counters.values())\
